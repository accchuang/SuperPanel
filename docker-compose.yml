services:
  postgres:
    image: postgres:16-alpine
    container_name: futures-dashboard-postgres
    environment:
      POSTGRES_DB: futures_dashboard
      POSTGRES_USER: futures
      POSTGRES_PASSWORD: futures
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futures -d futures_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
